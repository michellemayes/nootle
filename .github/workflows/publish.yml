name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, so two runs can't claim the same version. While one
# runs, further pushes wait as a single pending run that each newer push
# replaces, so a burst of merges builds at most twice (the run in flight, then
# the latest main) with no up-front wait. Never cancel an in-flight publish;
# that could leave a half-uploaded release.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Runs alongside the build instead of before it; the release stays a draft,
  # invisible to the updater, until this passes.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run tests
        run: cd src-tauri && cargo test --features system-audio

  build:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin

      # Restore before the version is written into Cargo.toml: the cache key
      # hashes it, so a per-release version would miss the cache every time
      # and re-upload ~1.4 GB on every publish.
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "./src-tauri -> target"

      # git-cliff runs directly rather than through git-cliff-action: the
      # action's output capture uses GNU stat, which fails on macOS runners
      # and leaves its outputs empty (every release fell back to a patch bump
      # with blank notes).
      - name: Install git-cliff
        run: pipx install git-cliff

      # Next version comes from the conventional commits since the latest v*
      # tag; the rules live in cliff.toml's [bump] section. Written into the
      # manifests for this build only, so no version-bump commit is needed.
      - name: Compute release version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          BUMPED=$(git-cliff --bumped-version)
          BUMPED="${BUMPED//[[:space:]]/}"
          if [ -z "$BUMPED" ] || [ "$BUMPED" = "$LATEST" ]; then
            # Nothing git-cliff counts as releasable (e.g. only chores): patch bump.
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            BUMPED="v${MAJOR:-0}.${MINOR:-0}.$(( ${PATCH:-0} + 1 ))"
          fi
          VERSION="${BUMPED#v}"
          echo "Latest tag: ${LATEST:-none} -> releasing v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          node -e '
            const fs = require("fs");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      # Release notes = conventional commits since the latest tag, grouped
      # by cliff.toml. Used as the GitHub release body.
      - name: Generate release notes
        id: release-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "content<<RELEASE_NOTES_EOF"
            git-cliff --unreleased --tag "$TAG" --strip header
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.release-notes.outputs.content }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: "--target aarch64-apple-darwin --features system-audio"

      - name: Cleanup build keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  # Publish the draft once both the build and the tests have passed. A draft
  # has no git tag yet, so publishing it is also what claims the version.
  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Verify updater assets and publish
        run: |
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -q 'latest.json' || { echo "Missing latest.json"; exit 1; }
          echo "$ASSETS" | grep -qE '\.sig$' || { echo "Missing .sig files"; exit 1; }
          gh release edit "$TAG" --draft=false --latest

      # Regenerate CHANGELOG.md on the latest main now that the new tag exists.
      # The commit only touches a .md file, so it doesn't trigger another publish.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      # Regenerated from scratch on each attempt: if main moves between
      # checkout and push, rebuild on the new main rather than rebasing a
      # changelog that would miss the commit that just landed.
      - name: Regenerate and push CHANGELOG.md
        run: |
          pipx install git-cliff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git-cliff --output CHANGELOG.md
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "CHANGELOG.md already up to date"
              exit 0
            fi
            git commit -m "chore: update changelog for $TAG"
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt); retrying on latest main"
          done
          exit 1

  # Drop the draft if tests or the build failed, so the next run's draft for
  # the same version starts clean.
  discard-draft:
    needs: [test, build]
    if: failure() && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Delete draft release
        run: gh release delete "$TAG" --yes || true

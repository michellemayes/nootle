name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "Casks/**"
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, so two runs can't claim the same version. While one
# runs, further pushes wait as a single pending run that each newer push
# replaces, so a burst of merges builds at most twice (the run in flight, then
# the latest main) with no up-front wait. Never cancel an in-flight publish;
# that could leave a half-uploaded release.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Runs alongside the build instead of before it; the release stays a draft,
  # invisible to the updater, until this passes.
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Run tests
        run: cd src-tauri && cargo test --features system-audio

  build:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Fails in seconds, not after the ~10 minute build, when notarization would.
      - name: Check Apple notarization access
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for delay in 15 30 60 120 0; do
            if OUT=$(xcrun notarytool history --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1); then
              exit 0
            fi
            echo "$OUT"
            if echo "$OUT" | grep -qi "agreement"; then
              echo "::error title=Apple agreement needs accepting::Sign in at https://developer.apple.com/account as the Account Holder, accept the updated agreement, then re-run this workflow."
              exit 1
            fi
            if ! echo "$OUT" | grep -qiE "status code: 5[0-9]{2}|try again|timed out|network"; then
              echo "::error title=Apple notarization unavailable::notarytool could not authenticate. Check the APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID secrets."
              exit 1
            fi
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          done
          echo "::warning title=Apple notary service unstable::notarytool kept returning server errors; building anyway, since notarization runs about 10 minutes from now."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin

      # Restore before the version is written into Cargo.toml: the cache key
      # hashes it, so a per-release version would miss the cache every time
      # and re-upload ~1.4 GB on every publish.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      # git-cliff runs directly rather than through git-cliff-action: the
      # action's output capture uses GNU stat, which fails on macOS runners
      # and leaves its outputs empty (every release fell back to a patch bump
      # with blank notes).
      - name: Install git-cliff
        run: pipx install git-cliff

      # Next version comes from the conventional commits since the latest v*
      # tag; the rules live in cliff.toml's [bump] section. Written into the
      # manifests for this build only, so no version-bump commit is needed.
      - name: Compute release version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          BUMPED=$(git-cliff --bumped-version)
          BUMPED="${BUMPED//[[:space:]]/}"
          if [ -z "$BUMPED" ] || [ "$BUMPED" = "$LATEST" ]; then
            # Nothing git-cliff counts as releasable (e.g. only chores): patch bump.
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            BUMPED="v${MAJOR:-0}.${MINOR:-0}.$(( ${PATCH:-0} + 1 ))"
          fi
          VERSION="${BUMPED#v}"
          echo "Latest tag: ${LATEST:-none} -> releasing v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          node -e '
            const fs = require("fs");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$VERSION"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      # Release notes = conventional commits since the latest tag, grouped
      # by cliff.toml. Used as the GitHub release body.
      - name: Generate release notes
        id: release-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "content<<RELEASE_NOTES_EOF"
            git-cliff --unreleased --tag "$TAG" --strip header
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Where opt-in crash reports go, compiled in; unset builds send none.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.release-notes.outputs.content }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: "--target aarch64-apple-darwin --features system-audio"

      - name: Cleanup build keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  # Publish the draft once both the build and the tests have passed. A draft
  # has no git tag yet, so publishing it is also what claims the version.
  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Verify updater assets and publish
        run: |
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -q 'latest.json' || { echo "Missing latest.json"; exit 1; }
          echo "$ASSETS" | grep -qE '\.sig$' || { echo "Missing .sig files"; exit 1; }
          gh release edit "$TAG" --draft=false --latest

      # Regenerate CHANGELOG.md on the latest main now that the new tag exists.
      # The commit only touches CHANGELOG.md and Casks/, which publish ignores.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0

      # Regenerated from scratch on each attempt: if main moves between
      # checkout and push, rebuild on the new main rather than rebasing a
      # changelog that would miss the commit that just landed.
      - name: Regenerate CHANGELOG.md, bump the Homebrew cask, and push
        run: |
          pipx install git-cliff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "Nootle_${VERSION}_aarch64.dmg" --dir /tmp/dmg
          SHA=$(sha256sum "/tmp/dmg/Nootle_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git-cliff --output CHANGELOG.md
            sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                   -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/nootle.rb
            git add CHANGELOG.md Casks/nootle.rb
            if git diff --cached --quiet; then
              echo "CHANGELOG.md and cask already up to date"
              exit 0
            fi
            git commit -m "chore: update changelog for $TAG"
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt); retrying on latest main"
          done
          exit 1

  # Drop the draft if tests or the build failed or timed out, so the next
  # run's draft for the same version starts clean. A timed-out job counts as
  # cancelled, which failure() misses.
  discard-draft:
    needs: [test, build]
    if: >-
      always() && needs.build.outputs.tag != '' &&
      (needs.test.result != 'success' || needs.build.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Delete draft release
        run: gh release delete "$TAG" --yes || true

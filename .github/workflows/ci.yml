name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Tauri build dependencies on Linux; one list keeps both jobs on one apt cache.
env:
  TAURI_LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

# A new push to a PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  # Type-checks and builds the frontend on every PR, not just Rust changes.
  check-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9
      - name: Frontend checks
        run: bash scripts/ci-frontend.sh

  # Opens every page at window sizes from the 300 px minimum up to a large
  # display and fails if anything is cut off (see docs/layout.md).
  check-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Layout check
        run: pnpm check:layout --shots layout-shots
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-shots
          path: layout-shots

  # Fast feedback on the platform-independent backend (search, pipeline,
  # database, LLM plumbing). macOS-only capture is covered by check-rust.
  test-rust-linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install system libraries
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.TAURI_LINUX_DEPS }}
      - name: Run tests
        run: cd src-tauri && cargo test

  # Runs a short two-speaker call through the real transcription, speaker
  # and search models and checks word error rate and speaker labels, so an
  # ML change that quietly breaks transcripts fails here instead of shipping.
  golden-models:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: golden-release
      - name: Install system libraries
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.TAURI_LINUX_DEPS }}
      - name: Cache models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/test-models
          key: test-models-${{ hashFiles('scripts/fetch-test-models.sh') }}
      - name: Fetch models
        run: bash scripts/fetch-test-models.sh ~/test-models
      - name: Golden tests
        run: cd src-tauri && XDG_DATA_HOME=~/test-models cargo test --profile golden --test models_test -- --ignored --nocapture

  # macOS minutes bill at 10x Linux, so this runs on PRs only. Changes reach
  # main through PRs, and Publish's test job still runs the macOS tests there.
  check-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 9
      - name: Install frontend dependencies
        run: pnpm install
      - name: Check formatting
        run: cd src-tauri && cargo fmt --check
      - name: Clippy (default features)
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings
      - name: Clippy (system-audio)
        run: cd src-tauri && cargo clippy --features system-audio --all-targets -- -D warnings
      - name: Run tests
        run: cd src-tauri && cargo test --features system-audio

\* Scaled-down constants that keep the real ratios: PAD < SPEECH < SIL <
\* SEARCH < MAXF, 2 * PAD <= SIL (so padding alone never overlaps), and a
\* silence just short of SIL longer than PAD + 1.
\* Real values in frames: PAD 6, SPEECH 8, SIL 16, SEARCH 125, MAXF 469.
CONSTANTS
    SIL = 5
    SPEECH = 3
    PAD = 2
    MAXF = 9
    SEARCH = 6
    MAXFRAMES = 14
    FIXED = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NotInverted RetainHonoured NoClippedAudio NoRepeatedAudio

    SIL = 6
    SPEECH = 4
    PAD = 3
    MAXF = 10
    SEARCH = 7
    MAXFRAMES = 15
    FIXED = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK RetainHonoured NoClippedAudio NoRepeatedAudio

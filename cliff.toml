[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/michellemayes/nootle/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^test", group = "Testing" },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# Next release version, from the commits since the latest tag (used by the
# publish workflow). fix/perf/etc. bump the patch and feat bumps the minor.
# A breaking change (feat!: or a BREAKING CHANGE: footer) bumps the minor
# while on 0.x and the major from 1.0 on. Going to 1.0.0 is a manual call,
# not something a commit triggers.
[bump]
breaking_always_bump_major = false

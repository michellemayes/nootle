<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #13111c;
    --text: #ece8f4;
    --text-secondary: #a59fb6;
    --accent: #8b5cf6;
    --cyan: #22d3ee;
    --border: #352f47;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(55% 70% at 8% 0%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 70%),
      radial-gradient(45% 60% at 100% 100%, color-mix(in srgb, var(--cyan) 18%, transparent), transparent 70%),
      var(--bg);
    font-family: "DM Sans", sans-serif;
    color: var(--text);
  }
  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.01em; }
  h1 {
    font-family: "Outfit", sans-serif;
    font-weight: 800;
    font-size: 82px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin-bottom: 30px;
  }
  .underline { position: relative; display: inline-block; }
  .underline svg { position: absolute; left: 0; bottom: -0.1em; width: 100%; height: 0.22em; overflow: visible; }
  p {
    font-size: 27px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--text-secondary);
  }
  p strong { color: var(--text); font-weight: 600; }
  .shot {
    position: absolute;
    left: 668px;
    top: 86px;
    width: 900px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgb(0 0 0 / 0.4),
      0 40px 80px -20px rgb(0 0 0 / 0.7),
      0 0 120px -20px color-mix(in srgb, var(--accent) 45%, transparent);
    overflow: hidden;
  }
  /* meeting-dark.png pads the 2884x1804 window with 158px/126px of backdrop; crop it out. */
  .shot img { display: block; width: calc(100% * 3200 / 2884); margin: calc(-100% * 126 / 2884) 0 0 calc(-100% * 158 / 2884); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="../../site/public/nootle-icon.svg" alt="">
      <span>Nootle</span>
    </div>
    <h1>AI meeting<br><span class="underline">recorder<svg viewBox="0 0 300 24" preserveAspectRatio="none"><path d="M4 16 C 60 6, 120 4, 170 10 S 260 20, 296 8" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/></svg></span><br>for Mac</h1>
    <p>No bot in your calls. Transcribed<br>on your Mac. <strong>Free &amp; open source.</strong></p>
  </div>
  <div class="shot"><img src="../../site/public/screenshots/meeting-dark.png" alt=""></div>
</body>
</html>

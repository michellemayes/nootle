[package]
name = "nootle-app"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "nootle-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nootle_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nootle-cli"
path = "src/bin/nootle-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api lets the meeting pop-up window be transparent.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
sqlite-vec = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
sha2 = "0.10"
tokio-util = "0.7"
dirs = "6"
cpal = "0.15"
ringbuf = "0.4"
hound = "3.5"
# Decodes imported recordings (mp3, m4a, mp4, mov, wav, flac, ogg, …).
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3", "aiff", "caf"] }
cidre = { version = "0.14", features = ["av"], optional = true }
ort = { version = "2.0.0-rc.11", features = ["coreml", "ndarray"] }
ndarray = "0.16"
rustfft = "6"
block2 = "0.6"
objc2 = "0.6"
rmcp = { version = "2.2", features = ["server", "transport-io", "client", "auth", "reqwest-native-tls", "transport-streamable-http-client-reqwest"] }
schemars = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
url = "2"
log = "0.4"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"

[features]
# Without system-audio, capture is a mic-only stub, so a meeting recorder
# would miss everyone else in the meeting.
default = ["system-audio"]
system-audio = ["cidre"]
